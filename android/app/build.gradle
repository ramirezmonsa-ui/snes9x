plugins {
    id 'com.android.application'
}

android {
    namespace 'com.snes9x.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.snes9x.mobile'
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName '0.2'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK can be installed directly.
            // CI keeps that key in its cache so every build has the same
            // signature and installs over the previous one.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
}
