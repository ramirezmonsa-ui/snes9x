plugins {
    id 'com.android.application'
}

android {
    namespace 'com.snes9x.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.snes9x.mobile'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.4'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    // CI provides a key that stays the same between builds (see
    // .github/workflows/android.yml). Local builds use the debug key.
    def ciKeystore = System.getenv('SIGNING_STORE_FILE')
    signingConfigs {
        if (ciKeystore) {
            ci {
                storeFile file(ciKeystore)
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias 'app'
                keyPassword System.getenv('SIGNING_STORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ciKeystore ? signingConfigs.ci : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
}
