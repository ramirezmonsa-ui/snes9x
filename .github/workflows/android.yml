name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - 'libretro/**'
      - '*.cpp'
      - '*.h'
      - 'apu/**'
      - 'filter/**'
      - '.github/workflows/android.yml'
      - '.github/scripts/android-smoke-test.sh'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only mGBA; the repository's other submodules are for the desktop builds.
      - name: Fetch mGBA
        run: git submodule update --init --depth 1 android/third_party/mgba

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Every APK must be signed with the same key, or Android refuses to
      # install it over the previous one. The key lives in the repository
      # secrets SIGNING_KEYSTORE_BASE64 and SIGNING_STORE_PASSWORD. Without
      # them, a key is made on the first build and kept in the private
      # Actions cache instead (GitHub drops it after 7 days unused).
      - name: Use signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p ~/snes9x-signing
          echo "$KEYSTORE_BASE64" | base64 -d > ~/snes9x-signing/secret.keystore
          echo "SIGNING_STORE_FILE=$HOME/snes9x-signing/secret.keystore" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Restore signing key
        if: env.SIGNING_STORE_FILE == ''
        uses: actions/cache@v4
        with:
          path: ~/snes9x-signing
          key: snes9x-signing-v1

      - name: Create signing key if missing
        if: env.SIGNING_STORE_FILE == ''
        run: |
          dir=~/snes9x-signing
          if [ ! -f "$dir/app.keystore" ]; then
            mkdir -p "$dir"
            openssl rand -hex 24 > "$dir/password"
            keytool -genkeypair -keystore "$dir/app.keystore" -storetype PKCS12 \
              -storepass "$(cat "$dir/password")" -alias app -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Snes9x Mobile"
          fi
          echo "::add-mask::$(cat "$dir/password")"
          echo "SIGNING_STORE_FILE=$dir/app.keystore" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$(cat "$dir/password")" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      # Should stay the same from build to build (see "Restore signing key").
      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/*.apk | grep -i "SHA-256"

      - uses: actions/upload-artifact@v4
        with:
          name: snes9x-mobile-apk
          path: android/app/build/outputs/apk/release/*.apk

  # Opens the app on an Android emulator to catch crashes before anyone
  # installs the APK.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: snes9x-mobile-apk
          path: android/app/build/outputs/apk/release

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - run: pip install pillow

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/android-smoke-test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: android-screens/

  # Publishes the APK that passed the smoke test as a GitHub Release, so
  # anyone can download the newest version without a GitHub account from
  # https://github.com/<owner>/<repo>/releases/latest
  release:
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: snes9x-mobile-apk
          path: apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv apk/*.apk snes9x-mobile.apk
          cat > notes.md <<'NOTES'
          Emulador de **Super Nintendo, Game Boy Advance, Game Boy y Game Boy Color** para Android.

          ### Cómo instalarla
          1. Descarga **snes9x-mobile.apk** (abajo, en *Assets*).
          2. Ábrelo. Si Android lo pide, permite "instalar apps de origen desconocido".
          3. Si aparece Play Protect, toca **Más detalles → Instalar de todos modos**.

          Necesita Android 8 o más nuevo. Los juegos no vienen incluidos.
          NOTES
          gh release create "android-build-${{ github.run_number }}" snes9x-mobile.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Snes9x Mobile · versión ${{ github.run_number }}" \
            --notes-file notes.md \
            --latest
